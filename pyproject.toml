[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "race-predictor"
version = "0.1.0"
description = "Race performance prediction from Strava / Garmin training data (extension of Z. Jarlaczynska's thesis)."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0", "numpy>=1.24", "python-dateutil>=2.8", "scikit-learn>=1.3", "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
lightgbm = ["lightgbm>=4"]  # macOS also needs `brew install libomp`
deep = ["tensorflow>=2.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks", "workshops"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
