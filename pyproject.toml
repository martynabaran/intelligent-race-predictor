[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "race-predictor"
version = "0.1.0"
description = "Race performance prediction from Strava / Garmin training data (extension of Z. Jarlaczynska's thesis)."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0", "numpy>=1.24", "python-dateutil>=2.8", "scikit-learn>=1.3", "tabulate>=0.9", "optuna>=3.5", "typer>=0.12",
]

[project.scripts]
race-predictor = "race_predictor.cli:app"

[project.optional-dependencies]
app = ["streamlit>=1.35", "plotly>=5"]
dev = ["pytest>=7", "ruff>=0.5"]
lightgbm = ["lightgbm>=4"]  # macOS also needs `brew install libomp`
deep = ["tensorflow>=2.16", "shap>=0.45", "matplotlib>=3.8"]
kaggle = ["kaggle>=1.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks", "workshops"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/race_predictor/cli.py" = ["B008"]  # typer idiom: Option()/Argument() as defaults
"experiments/*" = ["E501"]
