[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "race-predictor"
version = "0.1.0"
description = "Predict running race times from Strava and Garmin training data (extension of Z. Jarlaczyńska's thesis)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "optuna>=3.5",
    "pandas>=2.0",
    "python-dateutil>=2.8",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "tabulate>=0.9",
    "typer>=0.12",
    "typing-extensions>=4.4",
]

[project.scripts]
race-predictor = "race_predictor.cli:app"

[project.optional-dependencies]
app = ["plotly>=5", "streamlit>=1.35"]
dev = [
    "mypy>=1.10",
    "pandas-stubs",
    "pytest>=7",
    "ruff>=0.5",
    "types-python-dateutil",
    "types-tabulate",
]
lightgbm = ["lightgbm>=4"]  # macOS also needs `brew install libomp`
deep = ["matplotlib>=3.8", "shap>=0.45", "tensorflow>=2.16"]
kaggle = ["kaggle>=1.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
race_predictor = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks", "workshops"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "D",       # pydocstyle
    "UP",      # pyupgrade
    "B",       # bugbear
    "C4",      # comprehensions
    "SIM",     # simplifications
    "RET",     # return statements
    "PIE", "PERF", "PTH", "PT", "ARG", "FBT", "T20", "RUF",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # typographic characters (x, en dash) are deliberate in text
    "D107",  # constructor arguments are documented in the class docstring
    "D105",  # magic methods
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "E501", "ARG", "FBT", "PT011", "PT012", "PT018"]
"experiments/*" = ["D103", "E501", "T20", "FBT"]  # scripts print their results
"scripts/*" = ["T20"]
"src/race_predictor/cli.py" = ["B008"]  # typer idiom: Option()/Argument() as defaults

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
enable_error_code = ["explicit-override"]

[[tool.mypy.overrides]]
module = [
    "keras.*", "tensorflow.*", "shap.*", "optuna.*", "scipy.*", "sklearn.*", "joblib.*",
    "lightgbm.*", "plotly.*", "streamlit.*", "matplotlib.*", "kaggle.*",
]
ignore_missing_imports = true
